name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: brew install sdl3 pkgconf

      - name: Build
        run: make mw2

      - name: Build .app bundle
        run: sh scripts/macos_app.sh

      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/MW2-Port-${{ github.ref_name }}-macos-arm64.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  build-linux:
    runs-on: ubuntu-22.04   # (older glibc: the tarball runs on more systems)
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # (libgl / libegl: SDL3's own build - its OpenGL / EGL video and render backends; the port draws through SDL's GPU
          # API - Vulkan on Linux, loaded at run time; SDL3 carries the Vulkan headers - and its shaders are in the source)
          sudo apt-get install -y build-essential cmake pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      # Ubuntu 22.04 / 24.04 have no SDL3 package: build the release from source (its video / audio backends are loaded
      # at run time, so one build serves X11 and Wayland, PulseAudio, PipeWire and ALSA) and ship libSDL3.so.0 beside mw2
      - name: Build SDL3
        run: |
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz
          tar xzf sdl3.tar.gz
          cmake -S SDL3-${SDL3_VERSION} -B sdl3-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/sdl3 -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF
          cmake --build sdl3-build -j$(nproc)
          cmake --install sdl3-build
          echo "SDL3_DIR=$PWD/sdl3" >> $GITHUB_ENV

      - name: Build
        run: make mw2 SDL3_DIR=$SDL3_DIR SDL3_LIBS="-L$SDL3_DIR/lib -lSDL3 -Wl,-rpath,\\\$\$ORIGIN"

      - name: Package
        run: |
          mkdir -p dist/MW2-Port
          readelf -d mw2 | grep -q 'RUNPATH.*\$ORIGIN'
          cp mw2 dist/MW2-Port/
          cp -L $SDL3_DIR/lib/libSDL3.so.0 dist/MW2-Port/
          cp -r assets dist/MW2-Port/
          cp README.md THIRD_PARTY.md LICENSE dist/MW2-Port/
          cd dist && tar czf MW2-Port-${{ github.ref_name }}-linux-x86_64.tar.gz MW2-Port

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build deps
        run: dnf install -y git rpm-build rpmdevtools gcc gcc-c++ make pkgconf-pkg-config SDL3-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          rpmbuild -bb packaging/mw2port.spec \
            --define "_sourcedir $PWD" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_version $VERSION"
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  build-windows:
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64; ships SDL3.dll beside mw2.exe
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and SDL3 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64 pkg-config zip
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-devel-${SDL3_VERSION}-mingw.tar.gz
          tar xzf sdl3.tar.gz
          echo "SDL=$PWD/SDL3-${SDL3_VERSION}/x86_64-w64-mingw32" >> $GITHUB_ENV

      - name: Build
        run: make mw2 WINDOWS=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ AR=x86_64-w64-mingw32-ar SDL3_DIR=$SDL

      - name: Package
        run: |
          mkdir -p dist/MW2-Port
          cp mw2.exe $SDL/bin/SDL3.dll dist/MW2-Port/
          cp -r assets dist/MW2-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md LICENSE dist/MW2-Port/
          cd dist && zip -r MW2-Port-${{ github.ref_name }}-windows-x64.zip MW2-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  build-windows-legacy:
    # the legacy build for Windows XP-era PCs: 32-bit, SDL2 (SDL3 does not run on XP), the OpenGL 1.2 renderer (RB=gl12),
    # SSE2 (Pentium 4 / Athlon 64 or newer); ships SDL2.dll beside mw2.exe. Modern PCs: the windows-x64 zip
    runs-on: ubuntu-24.04
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686) and SDL2 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-i686 pkg-config zip
          curl -sSfL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar xzf sdl2.tar.gz
          echo "SDL2_PREFIX=$PWD/SDL2-${SDL2_VERSION}/i686-w64-mingw32" >> $GITHUB_ENV

      - name: Build
        run: make mw2 WINDOWS=1 RB=gl12 SDL=2 CC=i686-w64-mingw32-gcc CXX=i686-w64-mingw32-g++ AR=i686-w64-mingw32-ar SDL2_DIR=$SDL2_PREFIX

      - name: Check the imports (every DLL function Windows XP SP3 has)
        run: |
          i686-w64-mingw32-objdump -p mw2.exe | grep -E "DLL Name|^\s+[0-9a-f]+\s+[0-9]+ " > imports.txt
          cat imports.txt
          if grep -E "api-ms-win|ucrtbase|GetTickCount64|ConditionVariable|GetThreadId|SetFileInformationByHandle|_putenv_s|InitOnce|SRWLock" imports.txt; then
            echo "mw2.exe imports a function Windows XP does not have" >&2; exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist/MW2-Port
          cp mw2.exe $SDL2_PREFIX/bin/SDL2.dll dist/MW2-Port/
          cp -r assets dist/MW2-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md LICENSE packaging/windows/README-legacy.txt dist/MW2-Port/
          cd dist && zip -r MW2-Port-${{ github.ref_name }}-windows-x86-legacy.zip MW2-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows-legacy
          path: dist/*.zip

  release:
    needs: [build-macos, build-linux, build-fedora, build-windows, build-windows-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
