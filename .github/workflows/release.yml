name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Build
        run: make mw2

      - name: Build .app bundle
        run: sh scripts/macos_app.sh

      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/MW2-Port-${{ github.ref_name }}-macos-arm64.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev

      - name: Build
        run: make mw2

      - name: Package
        run: |
          mkdir -p dist/MW2-Port
          cp mw2 dist/MW2-Port/
          cp -r assets dist/MW2-Port/
          cp README.md THIRD_PARTY.md dist/MW2-Port/
          cd dist && tar czf MW2-Port-${{ github.ref_name }}-linux-x86_64.tar.gz MW2-Port

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build deps
        run: dnf install -y git rpm-build rpmdevtools gcc gcc-c++ make SDL2-devel mesa-libGL-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          rpmbuild -bb packaging/mw2port.spec \
            --define "_sourcedir $PWD" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_version $VERSION"
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  build-windows:
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64; ships SDL2.dll beside mw2.exe
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and SDL2 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64 zip
          curl -sSfL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar xzf sdl2.tar.gz
          SDL=$PWD/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32
          sed -i "s|^prefix=.*|prefix=$SDL|" $SDL/bin/sdl2-config
          echo "SDL=$SDL" >> $GITHUB_ENV

      - name: Build
        run: make mw2 WINDOWS=1 CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ AR=x86_64-w64-mingw32-ar SDL2_CONFIG=$SDL/bin/sdl2-config

      - name: Package
        run: |
          mkdir -p dist/MW2-Port
          cp mw2.exe $SDL/bin/SDL2.dll dist/MW2-Port/
          cp -r assets dist/MW2-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md dist/MW2-Port/
          cd dist && zip -r MW2-Port-${{ github.ref_name }}-windows-x64.zip MW2-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [build-macos, build-linux, build-fedora, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
